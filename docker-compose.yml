services:
  
  redis:
      image: redis:8
      container_name: redis
      ports: 
        - "6379:6379"
      volumes:
        - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  
    

volumes:
  minio_data:
  redis_data:
